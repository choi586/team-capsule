name: GitHub Pages에 게시

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6

      - name: pnpm 준비
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Node.js 준비
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 검사 및 빌드
        run: pnpm check

      - name: GitHub Pages 준비
        uses: actions/configure-pages@v5

      - name: 사이트 파일 올리기
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 사이트 공개
        id: deployment
        uses: actions/deploy-pages@v4
