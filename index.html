  <body>
    <a class="skip-link" href="#main-content">본문으로 바로가기</a>
    <div id="app"></div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="dialog-title">
      <form method="dialog">
        <div class="dialog-sticker" aria-hidden="true">!</div>
        <h2 id="dialog-title"></h2>
        <p id="dialog-message"></p>
        <div class="dialog-actions">
          <button class="button button-ghost" value="cancel">취소</button>
          <button id="dialog-confirm" class="button button-primary" value="confirm">확인</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
